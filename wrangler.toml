name = "nen-circleci-mcp"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "b27a78e5d8a8447ea233f0e7c92459d4"

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "CircleMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CircleMCP"]

[[durable_objects.bindings]]
name = "OAUTH_REPLAY_GUARD"
class_name = "OAuthReplayGuard"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["OAuthReplayGuard"]
