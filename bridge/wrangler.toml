name = "nen-ci-bridge"
main = "src/index.mjs"
compatibility_date = "2026-10-20"
workers_dev = false
preview_urls = false

[[kv_namespaces]]
binding = "QUEUE"
id = "3ad53b33be4346a0b6cf1e1d3047ede4"

# Commands arrive through the authenticated Cloudflare Queues API only.
[[queues.consumers]]
queue = "nen-ci-bridge-commands"
